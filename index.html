<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portale Studenti — Accesso, Bacheca, Profilo e Ricerca</title>
<style>
:root{--bg:#f6f8ff;--card:#ffffff;--accent:#2563eb;--muted:#475569}
*{box-sizing:border-box}
body{font-size:18px;font-family:Inter,system-ui,Arial;margin:0;background:linear-gradient(180deg,var(--bg),#eef2ff);min-height:100vh;padding:24px}
.card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,0.06);margin-bottom:20px}
label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
input[type="text"],input[type="email"],input[type="password"],textarea,select{width:100%;padding:10px;border:1px solid #e6edf9;border-radius:8px;font-size:14px}
textarea{resize:vertical}
button{padding:8px 12px;border-radius:8px;border:0;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none}
.post{border-bottom:1px solid #eef2ff;padding:12px 0; display:flex; align-items:flex-start; gap:10px;}
.post img{width:40px;height:40px;border-radius:50%;object-fit:cover;}
.post-content{flex:1;}
.meta{font-size:12px;color:#6b7280; margin-top:4px;}
.actions{display:flex;gap:8px;align-items:center;margin-top:10px}
.link{background:transparent;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;font-size:14px}
.popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,0.2);padding:20px;z-index:1000;display:none;max-width:320px;}
.popup img{width:80px;height:80px;border-radius:50%;object-fit:cover; margin-bottom:10px;}
.popup-close{float:right; cursor:pointer; font-weight:bold;}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:900;display:none;}
a.username{color:var(--accent); cursor:pointer;}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="page-login" class="card">
  <h2>Accesso Studenti</h2>
  <p class="muted">Usa il tuo account istituzionale (dominio: <strong>@isisleonardodavincipoggiomarino.it</strong>). La password condivisa è <strong>SG20513</strong>.</p>
  <form id="loginForm" autocomplete="off">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="nome.cognome@isisleonardodavincipoggiomarino.it" required />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="La password condivisa" required />
    <button type="submit">Accedi</button>
    <div id="loginMsg" class="muted"></div>
  </form>
</section>

<!-- CAMBIO PASSWORD -->
<section id="page-password" class="card hidden">
  <h2>Cambia Password</h2>
  <p class="muted">È il tuo primo accesso, devi impostare una nuova password.</p>
  <input id="newPassword" type="password" placeholder="Nuova password" />
  <button id="changePasswordBtn">Salva Password</button>
</section>

<!-- BACHECA -->
<section id="page-board" class="hidden">
  <section id="posts" class="card"></section>
  <div class="card">
    <h2>Bacheca della scuola</h2>
    <textarea id="body" rows="5" placeholder="Scrivi qui..."></textarea>
    <label><input type="checkbox" id="anonymous"> Pubblica in anonimo</label>
    <div class="actions">
      <button id="postBtn">Pubblica</button>
      <button id="gotoProfile" class="link">Profilo</button>
      <button id="gotoSearch" class="link">Cerca Profili</button>
      <button id="logoutBtn" class="link">Esci</button>
    </div>
  </div>
</section>

<!-- PROFILO -->
<section id="page-profile" class="card hidden">
  <h2>Profilo Studente</h2>
  <form id="profileForm">
    <div style="text-align:center;margin-bottom:14px">
      <img id="profilePicPreview" src="" style="width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid #e2e8f0;" />
    </div>
    <label for="p_pic">Foto profilo</label>
    <input id="p_pic" type="file" accept="image/*" />
    <label for="p_username">Username</label>
    <input id="p_username" type="text" placeholder="Nome visualizzato" />
    <label for="p_classe">Classe</label>
    <select id="p_classe"><option value="">-- seleziona --</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <label for="p_sezione">Sezione</label>
    <select id="p_sezione"><option value="">-- seleziona --</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
    <label for="p_indirizzo">Indirizzo</label>
    <select id="p_indirizzo"><option value="">-- seleziona --</option><option>OSA</option><option>AFM</option><option>SIA</option><option>Q</option><option>CAT</option><option>ITI</option><option>LC</option><option>LL</option><option>LS</option></select>
    <div class="actions">
      <button type="submit">Salva Profilo</button>
      <button type="button" id="deleteProfileBtn" class="link">Elimina Profilo</button>
      <button type="button" id="backBoard" class="link">Torna alla Bacheca</button>
    </div>
    <div id="profileMsg" class="muted" style="margin-top:10px"></div>
  </form>
</section>

<!-- CERCA PROFILI -->
<section id="page-search" class="card hidden">
  <h2>Cerca Profili</h2>
  <label for="searchInput">Username</label>
  <input id="searchInput" type="text" placeholder="Inserisci username..." />
  <button id="searchBtn">Cerca</button>
  <div id="searchResults" style="margin-top:20px"></div>
  <button id="backBoardFromSearch" class="link">Torna alla Bacheca</button>
</section>

<!-- POPUP PROFILO -->
<div class="overlay" id="overlay"></div>
<div class="popup" id="profilePopup">
  <span class="popup-close" id="popupClose">×</span>
  <img id="popupPic" src="" />
  <h3 id="popupUsername"></h3>
  <p id="popupClasse"></p>
  <p id="popupIndirizzo"></p>
  <div id="popupPosts"></div>
</div>

<script>
const API_URL='';

// PAGINE
const pageLogin=document.getElementById('page-login');
const pagePassword=document.getElementById('page-password');
const pageBoard=document.getElementById('page-board');
const pageProfile=document.getElementById('page-profile');
const pageSearch=document.getElementById('page-search');

function showPage(page){
  pageLogin.classList.add('hidden'); pagePassword.classList.add('hidden'); 
  pageBoard.classList.add('hidden'); pageProfile.classList.add('hidden'); pageSearch.classList.add('hidden'); 
  page.classList.remove('hidden');
}

// ELEMENTI
const loginForm=document.getElementById('loginForm');
const emailInput=document.getElementById('email');
const passwordInput=document.getElementById('password');
const loginMsg=document.getElementById('loginMsg');

const newPasswordInput=document.getElementById('newPassword');
const changePasswordBtn=document.getElementById('changePasswordBtn');

const postBtn=document.getElementById('postBtn');
const bodyInput=document.getElementById('body');
const postsEl=document.getElementById('posts');
const logoutBtn=document.getElementById('logoutBtn');
const gotoProfile=document.getElementById('gotoProfile');
const gotoSearch=document.getElementById('gotoSearch');

const p_pic=document.getElementById('p_pic');
const profilePicPreview=document.getElementById('profilePicPreview');
const p_username=document.getElementById('p_username');
const p_classe=document.getElementById('p_classe');
const p_sezione=document.getElementById('p_sezione');
const p_indirizzo=document.getElementById('p_indirizzo');
const profileForm=document.getElementById('profileForm');
const profileMsg=document.getElementById('profileMsg');
const backBoard=document.getElementById('backBoard');
const deleteProfileBtn=document.getElementById('deleteProfileBtn');

const searchInput=document.getElementById('searchInput');
const searchBtn=document.getElementById('searchBtn');
const searchResults=document.getElementById('searchResults');
const backBoardFromSearch=document.getElementById('backBoardFromSearch');

const overlay=document.getElementById('overlay');
const profilePopup=document.getElementById('profilePopup');
const popupClose=document.getElementById('popupClose');
const popupPic=document.getElementById('popupPic');
const popupUsername=document.getElementById('popupUsername');
const popupClasse=document.getElementById('popupClasse');
const popupIndirizzo=document.getElementById('popupIndirizzo');
const popupPosts=document.getElementById('popupPosts');

// UTILI
function getCurrentUser(){ return JSON.parse(localStorage.getItem('student_user')); }
function saveCurrentUser(u){ localStorage.setItem('student_user', JSON.stringify(u)); }

// LOGIN
loginForm.addEventListener('submit', e=>{
  e.preventDefault();
  const email=emailInput.value.trim();
  const password=passwordInput.value.trim();
  if(!email.endsWith('@isisleonardodavincipoggiomarino.it')){
    loginMsg.textContent='Usa un account istituzionale valido';
    return;
  }
  fetch(`${API_URL}/login`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  }).then(res=>res.json()).then(data=>{
    if(data.success){
      saveCurrentUser(data.user);
      if(data.first_login){
        showPage(pagePassword);
      }else{
        renderPosts();
        showPage(pageBoard);
      }
    }else loginMsg.textContent=data.message;
  });
});

// CAMBIO PASSWORD
changePasswordBtn.addEventListener('click',()=>{
  const user=getCurrentUser();
  const new_pw=newPasswordInput.value.trim();
  if(!new_pw){ alert('Inserisci una nuova password'); return; }
  fetch(`${API_URL}/updatePassword`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id:user.id,new_password:new_pw})
  }).then(()=>{ user.password=new_pw; user.first_login=0; saveCurrentUser(user); renderPosts(); showPage(pageBoard); });
});

// BACHECA
postBtn.addEventListener('click',()=>{
  const user=getCurrentUser();
  const body=bodyInput.value.trim();
  const anon=document.getElementById('anonymous').checked;
  if(!body) return alert('Scrivi un messaggio');
  fetch(`${API_URL}/post`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id:user.id,body,anonymous:anon})
  }).then(()=>{ bodyInput.value=''; renderPosts(); });
});

logoutBtn.addEventListener('click',()=>{ localStorage.removeItem('student_user'); showPage(pageLogin); });
gotoProfile.addEventListener('click',()=>{ showPage(pageProfile); });
gotoSearch.addEventListener('click',()=>{ showPage(pageSearch); });

// PROFILO
profileForm.addEventListener('submit',e=>{
  e.preventDefault();
  const user=getCurrentUser();
  const formData=new FormData();
  formData.append('username',p_username.value.trim());
  formData.append('classe',p_classe.value);
  formData.append('sezione',p_sezione.value);
  formData.append('indirizzo',p_indirizzo.value);
  formData.append('profile_pic',profilePicPreview.src);
  fetch(`${API_URL}/updateProfile?id=${user.id}`,{
    method:'POST',body:formData
  }).then(()=>{ profileMsg.textContent='Profilo aggiornato'; renderPosts(); });
});

// CANCELLA PROFILO
deleteProfileBtn.addEventListener('click',()=>{
  const user=getCurrentUser();
  if(confirm('Vuoi eliminare il tuo profilo? Tutti i messaggi saranno eliminati.')){
    fetch(`${API_URL}/deleteProfile`,{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:user.id})
    }).then(()=>{ localStorage.removeItem('student_user'); showPage(pageLogin); });
  }
});

// FOTO PROFILO
p_pic.addEventListener('change',()=>{
  const file=p_pic.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{ profilePicPreview.src=reader.result; };
  reader.readAsDataURL(file);
});

// RICERCA PROFILI
searchBtn.addEventListener('click',()=>{
  const q=searchInput.value.trim().toLowerCase();
  searchResults.innerHTML='';
  fetch(`${API_URL}/users`).then(res=>res.json()).then(users=>{
    users.filter(u=>u.username.toLowerCase().includes(q)).forEach(u=>{
      const div=document.createElement('div'); div.className='card';
      div.innerHTML=`<img src='${u.profile_pic||''}' style='width:40px;height:40px;border-radius:50%;margin-right:10px;vertical-align:middle;cursor:pointer;' class="popup-trigger" data-id="${u.id}"/> <strong class="popup-trigger" data-id="${u.id}">${u.username}</strong> - Classe ${u.classe}${u.sezione} - ${u.indirizzo}`;
      searchResults.appendChild(div);
    });
    attachPopupTriggers();
  });
});

backBoardFromSearch.addEventListener('click',()=>{ showPage(pageBoard); });

// POPUP PROFILO
function attachPopupTriggers(){
  document.querySelectorAll('.popup-trigger').forEach(el=>{
    el.onclick=()=>{
      const uid=el.dataset.id;
      fetch(`${API_URL}/users`).then(res=>res.json()).then(users=>{
        const u=users.find(x=>x.id==uid);
        if(u){
          popupPic.src=u.profile_pic||'';
          popupUsername.textContent=u.username;
          popupClasse.textContent=`Classe ${u.classe}${u.sezione}`;
          popupIndirizzo.textContent=u.indirizzo;
          fetch(`${API_URL}/posts`).then(res=>res.json()).then(posts=>{
            const userPosts=posts.filter(p=>p.user_id==u.id && !p.anonymous);
            popupPosts.innerHTML=userPosts.map(p=>`<p>${p.body}</p>`).join('');
            overlay.style.display='block';
            profilePopup.style.display='block';
          });
        }
      });
    }
  });
}
popupClose.onclick=()=>{ overlay.style.display='none'; profilePopup.style.display='none'; }

// RENDER POST
function renderPosts(){
  fetch(`${API_URL}/posts`).then(res=>res.json()).then(posts=>{
    postsEl.innerHTML='';
    const user=getCurrentUser();
    posts.forEach(p=>{
      const div=document.createElement('div'); div.className='post';
      let profileImg=p.anonymous?'':'<img src="'+p.profile_pic+'"/>';
      let username=p.anonymous?'Anonimo':`<a class="username popup-trigger" data-id="${p.user_id}">${p.username}</a>`;
      div.innerHTML=`${profileImg}<div class='post-content'>${username}<div>${p.body.replace(/@(\w+)/g, `<a href="#" class="username tag" data-username="$1">@$1</a>`)}</div><div class='meta'>${new Date(p.timestamp).toLocaleString()} <span class="link delete-post" data-id="${p.id}">Elimina</span></div></div>`;
      postsEl.appendChild(div);
    });
    attachPopupTriggers();
    document.querySelectorAll('.delete-post').forEach(el=>{
      el.onclick=()=>{
        if(confirm('Eliminare questo messaggio?')){
          fetch(`${API_URL}/deletePost`,{
            method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({post_id:el.dataset.id})
          }).then(()=> renderPosts());
        }
      }
    });
  });
}

// CARICAMENTO AUTOMATICO
const currentUser=localStorage.getItem('student_user');
if(currentUser){ renderPosts(); showPage(pageBoard); }
</script>
</body>
</html>
