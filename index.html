<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portale Studenti — Scuola</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<!-- LOGIN FULLSCREEN (nuovo) -->
<section id="page-login" class="login-fullscreen">
  <div class="login-card">
    <h1 class="login-title">Accedi al Portale Studenti</h1>

    <form id="loginForm" class="login-form">
      <input type="email" id="email" placeholder="Email istituzionale" required />
      <input type="password" id="password" placeholder="Password" required />
      <div style="display:flex;gap:8px;margin-top:12px">
        <button type="submit" class="btn-primary">Accedi</button>
        <button type="button" id="btnShowReset" class="link-btn">Hai dimenticato?</button>
      </div>
      <div id="loginMsg" class="muted" style="margin-top:10px"></div>
    </form>

    <div class="divider"></div>

    <p class="signup-text">Non hai un account?
      <button id="goToSignup" class="link-btn">Registrati</button>
    </p>
  </div>
</section>

<!-- SIGNUP FULLSCREEN -->
<section id="page-signup" class="signup-fullscreen hidden">
  <div class="login-card">
    <h1 class="login-title">Crea un account</h1>

    <form id="signupForm" class="login-form">
      <input type="text" id="s_username" placeholder="Username (opzionale)" />
      <input type="email" id="s_email" placeholder="Email" required />
      <input type="password" id="s_password" placeholder="Password" required />
      <input type="password" id="s_confirm" placeholder="Conferma password" required />
      <button type="submit" class="btn-primary">Registrati</button>
    </form>

    <div class="divider"></div>

    <p class="signup-text">Hai già un account?
      <button id="goToLogin" class="link-btn">Accedi</button>
    </p>
  </div>
</section>

<!-- MAIN APP CONTAINER: bacheca, profilo, ricerca ecc. -->
<div class="container">

  <!-- PAGE: LOGIN (legacy - hidden because fullscreen controls actual login) -->
  <section id="page-login-legacy" class="card hidden">
    <h2>Accesso Studenti</h2>
    <p class="muted">Usa account istituzionale. Password generale.</p>
  </section>

  <!-- PAGE: BOARD -->
  <section id="page-board" class="card hidden">
    <h2>Bacheca</h2>
    <div id="feed" aria-live="polite"></div>
  </section>

  <!-- PAGE: PROFILE -->
  <section id="page-profile" class="card hidden">
    <h2>Profilo</h2>
    <div style="text-align:center">
      <img id="profilePicPreview" src="" style="width:140px;height:140px;border-radius:50%;object-fit:cover;margin-bottom:10px" />
    </div>
    <form id="profileForm">
      <label>Foto profilo</label>
      <input id="p_pic" type="file" accept="image/*" />
      <label>Username</label>
      <input id="p_username" type="text" placeholder="Username" />
      <label>Classe</label>
      <select id="p_classe"><option value="">-- seleziona --</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
      <label>Sezione</label>
      <select id="p_sezione"><option value="">-- seleziona --</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
      <label>Indirizzo</label>
      <select id="p_indirizzo"><option value="">-- seleziona --</option><option>OSA</option><option>AFM</option><option>SIA</option><option>Q</option><option>CAT</option><option>ITI</option><option>LC</option><option>LL</option><option>LS</option></select>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button type="submit" class="btn-primary">Salva Profilo</button>
        <button type="button" id="deleteProfileBtn" class="link-btn">Elimina Profilo</button>
      </div>
      <div id="profileMsg" style="margin-top:10px"></div>
    </form>
    <div style="margin-top:12px">
      <button id="btnChangePassword" class="link-btn">Cambia password</button>
    </div>
  </section>

  <!-- PAGE: SEARCH -->
  <section id="page-search" class="card hidden">
    <h2>Cerca Profili</h2>
    <label>Cerca username</label>
    <input id="searchInput" type="text" placeholder="es: nome.cognome" />
    <div style="margin-top:12px">
      <button id="searchBtn" class="btn-primary">Cerca</button>
    </div>
    <div id="searchResults" style="margin-top:16px"></div>
  </section>

</div>

<!-- Popup profile -->
<div id="popup" class="popup hidden" role="dialog" aria-modal="true" style="display:none">
  <button id="popupClose" class="link-btn" style="position:absolute;right:12px;top:10px">Chiudi</button>
  <img id="popupImg" src="" alt="Foto profilo" style="width:120px;height:120px;border-radius:50%;object-fit:cover;display:block;margin:8px auto"/>
  <h3 id="popupName"></h3>
  <div id="popupClass" class="small-muted"></div>
  <div id="popupAddress" class="small-muted"></div>
  <div id="popupPosts" style="margin-top:12px"></div>
</div>

<!-- Input area (WhatsApp style) -->
<div class="input-area" id="inputArea" style="display:none">
  <input id="messageInput" placeholder="Scrivi il messaggio" aria-label="Scrivi il messaggio"/>
  <label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="anonymous"> Anonimo</label>
  <button id="sendBtn" class="btn-primary">Invia</button>
</div>

<!-- Bottom navigation -->
<div class="bottom-bar" aria-hidden="false">
  <button id="navBoard" class="nav-btn"><span>Bacheca</span></button>
  <button id="navProfile" class="nav-btn"><span>Profilo</span></button>
  <button id="navSearch" class="nav-btn"><span>Cerca</span></button>
  <button id="navLogout" class="nav-btn"><span>Esci</span></button>
</div>

<!-- SCRIPT: frontend logic -->
<script>
const API_URL = ''; // same origin

// Elements
const pageLogin = document.getElementById('page-login');
const pageSignup = document.getElementById('page-signup');
const pageBoard = document.getElementById('page-board');
const pageProfile = document.getElementById('page-profile');
const pageSearch = document.getElementById('page-search');

const loginForm = document.getElementById('loginForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginMsg = document.getElementById('loginMsg');
const btnShowReset = document.getElementById('btnShowReset');

const signupForm = document.getElementById('signupForm');
const goToSignup = document.getElementById('goToSignup');
const goToLogin = document.getElementById('goToLogin');

const feed = document.getElementById('feed');
const inputArea = document.getElementById('inputArea');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');
const anonymousCheckbox = document.getElementById('anonymous');

const profileForm = document.getElementById('profileForm');
const p_pic = document.getElementById('p_pic');
const profilePicPreview = document.getElementById('profilePicPreview');
const p_username = document.getElementById('p_username');
const p_classe = document.getElementById('p_classe');
const p_sezione = document.getElementById('p_sezione');
const p_indirizzo = document.getElementById('p_indirizzo');
const profileMsg = document.getElementById('profileMsg');
const deleteProfileBtn = document.getElementById('deleteProfileBtn');
const btnChangePassword = document.getElementById('btnChangePassword');

const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchResults = document.getElementById('searchResults');

const popup = document.getElementById('popup');
const popupImg = document.getElementById('popupImg');
const popupName = document.getElementById('popupName');
const popupClass = document.getElementById('popupClass');
const popupAddress = document.getElementById('popupAddress');
const popupPosts = document.getElementById('popupPosts');
const popupClose = document.getElementById('popupClose');

const navBoard = document.getElementById('navBoard');
const navProfile = document.getElementById('navProfile');
const navSearch = document.getElementById('navSearch');
const navLogout = document.getElementById('navLogout');

let currentUser = null;

// helpers
function showOnly(pageEl){
  // hide all main pages (not login fullscreen)
  [pageBoard,pageProfile,pageSearch].forEach(p => p.classList.add('hidden'));
  pageEl.classList.remove('hidden');
  inputArea.style.display = (pageEl === pageBoard) ? 'flex' : 'none';
}

// session
const stored = localStorage.getItem('student_user');
if(stored){
  try{ currentUser = JSON.parse(stored); } catch(e){ localStorage.removeItem('student_user'); }
}
if(currentUser){
  // if user logged show main app
  pageLogin.classList.add('hidden');
  pageSignup.classList.add('hidden');
  if(currentUser.first_login){
    showOnly(pageProfile);
    profileMsg.innerHTML = '<span class="err">Primo accesso: modifica la password.</span>';
  } else {
    showOnly(pageBoard);
    loadProfileToForm();
    renderPosts();
  }
} else {
  // show login fullscreen
  pageLogin.classList.remove('hidden');
  pageSignup.classList.add('hidden');
}

// LOGIN
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim();
  const password = passwordInput.value.trim();
  if(!email || !password){ loginMsg.textContent = "Inserisci email e password"; return; }
  try{
    const res = await fetch(API_URL + '/api/login', {
      method: 'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(data.success){
      currentUser = data.user;
      localStorage.setItem('student_user', JSON.stringify(currentUser));
      pageLogin.classList.add('hidden');
      pageSignup.classList.add('hidden');
      if(currentUser.first_login){
        showOnly(pageProfile);
        profileMsg.innerHTML = '<span class="err">Primo accesso: modifica la password.</span>';
      } else {
        showOnly(pageBoard);
        loadProfileToForm();
        renderPosts();
      }
    } else {
      loginMsg.textContent = data.message || 'Credenziali errate';
    }
  } catch(err){
    console.error(err); loginMsg.textContent = 'Errore di rete';
  }
});

// GO TO SIGNUP / BACK TO LOGIN
goToSignup.addEventListener('click', () => {
  pageLogin.classList.add('hidden');
  pageSignup.classList.remove('hidden');
});
goToLogin.addEventListener('click', () => {
  pageSignup.classList.add('hidden');
  pageLogin.classList.remove('hidden');
});

// SIGNUP
signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('s_username').value.trim();
  const email = document.getElementById('s_email').value.trim();
  const password = document.getElementById('s_password').value;
  const confirm = document.getElementById('s_confirm').value;
  if(!email || !password){ alert('Inserisci email e password'); return; }
  if(password !== confirm){ alert('Le password non coincidono'); return; }
  try{
    const res = await fetch(API_URL + '/api/signup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    if(data.success){
      // auto-login after signup
      currentUser = data.user;
      localStorage.setItem('student_user', JSON.stringify(currentUser));
      pageSignup.classList.add('hidden');
      pageLogin.classList.add('hidden');
      showOnly(pageProfile);
      profileMsg.innerHTML = '<span class="success">Account creato. Completa il profilo.</span>';
      loadProfileToForm();
    } else {
      alert(data.message || 'Errore registrazione');
    }
  }catch(err){ console.error(err); alert('Errore di rete'); }
});

// NAV
navBoard.addEventListener('click', ()=>{ if(requireLogin()) showOnly(pageBoard); renderPosts(); });
navProfile.addEventListener('click', ()=>{ if(requireLogin()) showOnly(pageProfile); loadProfileToForm(); });
navSearch.addEventListener('click', ()=>{ if(requireLogin()) showOnly(pageSearch); });
navLogout.addEventListener('click', ()=>{ localStorage.removeItem('student_user'); currentUser=null; pageLogin.classList.remove('hidden'); pageSignup.classList.add('hidden'); showOnly(pageBoard); });

// Require login
function requireLogin(){ if(!currentUser){ pageLogin.classList.remove('hidden'); pageSignup.classList.add('hidden'); return false; } return true; }

// Load profile to form
function loadProfileToForm(){
  if(!currentUser) return;
  p_username.value = currentUser.username || '';
  p_classe.value = currentUser.classe || '';
  p_sezione.value = currentUser.sezione || '';
  p_indirizzo.value = currentUser.indirizzo || '';
  profilePicPreview.src = currentUser.profile_pic || '';
  profileMsg.innerHTML = '';
}

// PROFILE save
profileForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if(!currentUser){ alert('Devi prima effettuare il login'); return; }
  const username = p_username.value.trim();
  const classe = p_classe.value;
  const sezione = p_sezione.value;
  const indirizzo = p_indirizzo.value;
  const payload = { id: currentUser.id, username, classe, sezione, indirizzo };
  if(profilePicPreview.src && profilePicPreview.src.startsWith('data:')) payload.profile_pic = profilePicPreview.src;
  try{
    const res = await fetch(API_URL + '/api/updateProfile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const data = await res.json();
    if(data.success){
      currentUser = data.user;
      localStorage.setItem('student_user', JSON.stringify(currentUser));
      profileMsg.innerHTML = '<span class="success">Profilo aggiornato</span>';
      showOnly(pageBoard);
      renderPosts();
    } else profileMsg.innerHTML = `<span class="err">${data.message||'Errore'}</span>`;
  }catch(err){ console.error(err); profileMsg.innerHTML = '<span class="err">Errore di rete</span>'; }
});

// change password
btnChangePassword.addEventListener('click', async () => {
  if(!currentUser) return alert('Devi essere loggato');
  const oldp = prompt('Password attuale:','');
  const newp = prompt('Nuova password:','');
  if(!oldp || !newp) return alert('Input mancante');
  const res = await fetch(API_URL + '/api/changePassword', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: currentUser.id, oldPassword: oldp, newPassword: newp })});
  const data = await res.json();
  if(data.success) alert('Password cambiata'); else alert(data.message || 'Errore');
});

// preview profile pic
p_pic.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => profilePicPreview.src = reader.result;
  reader.readAsDataURL(file);
});

// POSTS
sendBtn.addEventListener('click', async () => {
  if(!currentUser){ pageLogin.classList.remove('hidden'); return; }
  const body = messageInput.value.trim();
  const anonymous = anonymousCheckbox.checked;
  if(!body) return;
  await fetch(API_URL + '/api/posts', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user_id: currentUser.id, body, anonymous })});
  messageInput.value='';
  renderPosts();
});

async function renderPosts(){
  try{
    const res = await fetch(API_URL + '/api/posts');
    const posts = await res.json();
    feed.innerHTML = '';
    posts.forEach(p => {
      const wrapper = document.createElement('div');
      wrapper.className = 'post';
      const isMe = currentUser && !p.anonymous && (p.user_id == currentUser.id);
      const imgHtml = (!p.anonymous && p.profile_pic) ? `<img src="${p.profile_pic}" class="profile-pic" data-user="${p.user_id}" style="cursor:pointer"/>` : `<div style="width:48px;"></div>`;
      const bubbleClass = isMe ? 'bubble me' : 'bubble';
      const username = p.anonymous ? 'Anonimo' : (p.username || 'Utente');
      const time = new Date(p.timestamp).toLocaleString();
      const bodyHtml = escapeHtml(p.body).replace(/\n/g,'<br>');
      wrapper.innerHTML = `
        ${imgHtml}
        <div style="flex:1">
          <div class="${bubbleClass}">${bodyHtml}</div>
          <div class="post-meta">${username} • ${time} • <span class="link delete-post" data-id="${p.id}">Elimina</span></div>
        </div>
      `;
      feed.appendChild(wrapper);
    });
    // bind events
    document.querySelectorAll('.delete-post').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        if(confirm('Eliminare questo messaggio?')) {
          await fetch(API_URL + '/api/deletePost', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id })});
          renderPosts();
        }
      };
    });
    document.querySelectorAll('img.profile-pic').forEach(img => img.onclick = () => {
      const uid = img.dataset.user; showProfilePopupById(uid,true);
    });
  }catch(err){ console.error(err); }
}

// SEARCH
searchBtn.addEventListener('click', async ()=> {
  if(!requireLogin()) return;
  const q = searchInput.value.trim().toLowerCase();
  searchResults.innerHTML = '';
  const res = await fetch(API_URL + '/api/users');
  const users = await res.json();
  const filtered = users.filter(u => u.username && u.username.toLowerCase().includes(q));
  filtered.forEach(u => {
    const div = document.createElement('div');
    div.className = 'card search-user';
    div.innerHTML = `<img src="${u.profile_pic||''}" style="width:56px;height:56px;border-radius:50%;object-fit:cover"/><div style="margin-left:12px;display:inline-block"><strong class="username-link" data-id="${u.id}">${u.username||u.email}</strong><div class="small-muted">Classe: ${u.classe||'-'} ${u.sezione||''} • ${u.indirizzo||'-'}</div></div>`;
    searchResults.appendChild(div);
    div.querySelector('.username-link').onclick = () => showProfilePopupById(u.id, true);
    div.querySelector('img').onclick = () => showProfilePopupById(u.id, true);
  });
});

// popup
async function showProfilePopupById(id, allowImageOpen){
  const resUsers = await fetch(API_URL + '/api/users');
  const users = await resUsers.json();
  const user = users.find(u => u.id == id);
  if(!user) return alert('Utente non trovato');
  popupImg.src = user.profile_pic || '';
  popupName.textContent = user.username || user.email;
  popupClass.textContent = `Classe: ${user.classe || '-' } ${user.sezione || ''}`;
  popupAddress.textContent = `Indirizzo: ${user.indirizzo || '-'}`;
  const resPosts = await fetch(API_URL + '/api/posts');
  const posts = await resPosts.json();
  const userPosts = posts.filter(p => p.user_id == id && !p.anonymous).slice(0,5);
  popupPosts.innerHTML = userPosts.length ? userPosts.map(p => `<div style="padding:6px 0;border-bottom:1px solid #f1f5f9">${escapeHtml(p.body)}</div>`).join('') : '<div class="small-muted">Nessun messaggio pubblico</div>';
  popup.style.display = 'block'; popup.classList.remove('hidden');
  if(allowImageOpen && popupImg.src){ popupImg.style.cursor='pointer'; popupImg.onclick = ()=> { const w = window.open(); w.document.write(`<img src="${popupImg.src}" style="width:100%;">`); } else popupImg.onclick=null; }
}
popupClose.addEventListener('click', ()=> { popup.style.display='none'; popup.classList.add('hidden'); });

// delete profile
deleteProfileBtn.addEventListener('click', async () => {
  if(!currentUser) return;
  if(!confirm('Eliminare definitivamente il profilo?')) return;
  const res = await fetch(API_URL + '/api/deleteProfile', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ id: currentUser.id })});
  const data = await res.json();
  if(data.success){ localStorage.removeItem('student_user'); currentUser=null; pageLogin.classList.remove('hidden'); showOnly(pageBoard); }
});

// helper escape
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c)); }

// delete post helper already used

// initial render if logged
if(currentUser && !currentUser.first_login){
  showOnly(pageBoard); renderPosts(); loadProfileToForm();
} else if(currentUser && currentUser.first_login){
  showOnly(pageProfile);
} else {
  // show login fullscreen (already visible)
}

// end script
</script>

</body>
</html>
