<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portale Studenti — Accesso, Bacheca, Profilo e Ricerca</title>
<style>
:root{--bg:#f6f8ff;--card:#ffffff;--accent:#2563eb;--muted:#475569}
*{box-sizing:border-box}
body{font-size:18px;font-family:Inter,system-ui,Arial;margin:0;background:linear-gradient(180deg,var(--bg),#eef2ff);min-height:100vh;padding:24px}
.card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,0.06);margin-bottom:20px}
label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
input[type="text"],input[type="email"],input[type="password"],textarea,select{width:100%;padding:10px;border:1px solid #e6edf9;border-radius:8px;font-size:14px}
textarea{resize:vertical}
button{padding:8px 12px;border-radius:8px;border:0;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none}
.post{border-bottom:1px solid #eef2ff;padding:12px 0; display:flex; align-items:flex-start; gap:10px;}
.post img{width:40px;height:40px;border-radius:50%;object-fit:cover;}
.post-content{flex:1;}
.meta{font-size:12px;color:#6b7280; margin-top:4px;}
.actions{display:flex;gap:8px;align-items:center;margin-top:10px}
.link{background:transparent;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;}
.username.tag{color:var(--accent);cursor:pointer;text-decoration:none;}
#profileMsg{color:green;}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="page-login" class="card">
  <h2>Accesso Studenti</h2>
  <p class="muted">Usa il tuo account istituzionale (dominio: <strong>@isisleonardodavincipoggiomarino.it</strong>). La password condivisa per il primo accesso è <strong>SG20513</strong>.</p>
  <form id="loginForm" autocomplete="off">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="nome.cognome@isisleonardodavincipoggiomarino.it" required />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Password" required />
    <button type="submit">Accedi</button>
    <div id="loginMsg" aria-live="polite" style="margin-top:10px"></div>
  </form>
  <div id="resetDiv" class="hidden">
    <button id="resetPasswordBtn">Reset password generale (SG20513)</button>
  </div>
</section>

<!-- BACHECA -->
<section id="page-board" class="hidden">
  <section id="posts" class="card"></section>
  <div class="card">
    <h2>Bacheca della scuola</h2>
    <p class="muted">Scrivi liberamente ciò che vuoi.</p>
    <label for="body">Contenuto</label>
    <textarea id="body" rows="5" placeholder="Scrivi qui..."></textarea>
    <label><input type="checkbox" id="anonymous"> Pubblica in anonimo</label>
    <div class="actions">
      <button id="postBtn">Pubblica</button>
      <button id="gotoProfile" class="link">Profilo</button>
      <button id="gotoSearch" class="link">Cerca Profili</button>
      <button id="logoutBtn" class="link">Esci</button>
    </div>
  </div>
</section>

<!-- PROFILO -->
<section id="page-profile" class="card hidden">
  <h2>Profilo Studente</h2>
  <form id="profileForm">
    <div style="text-align:center;margin-bottom:14px">
      <img id="profilePicPreview" src="" style="width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid #e2e8f0;" />
    </div>
    <label for="p_pic">Foto profilo</label>
    <input id="p_pic" type="file" accept="image/*" />
    <label for="p_username">Username</label>
    <input id="p_username" type="text" placeholder="Nome visualizzato" />
    <label for="p_classe">Classe</label>
    <select id="p_classe"><option value="">-- seleziona --</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <label for="p_sezione">Sezione</label>
    <select id="p_sezione"><option value="">-- seleziona --</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
    <label for="p_indirizzo">Indirizzo</label>
    <select id="p_indirizzo"><option value="">-- seleziona --</option><option>OSA</option><option>AFM</option><option>SIA</option><option>Q</option><option>CAT</option><option>ITI</option><option>LC</option><option>LL</option><option>LS</option></select>
    <button type="submit">Salva Profilo</button>
    <button type="button" id="deleteProfile" class="link">Elimina Profilo</button>
    <button type="button" id="backBoard" class="link">Torna alla Bacheca</button>
    <div id="profileMsg" class="muted" style="margin-top:10px"></div>
  </form>
</section>

<!-- CERCA PROFILI -->
<section id="page-search" class="card hidden">
  <h2>Cerca Profili</h2>
  <label for="searchInput">Username</label>
  <input id="searchInput" type="text" placeholder="Inserisci username..." />
  <button id="searchBtn">Cerca</button>
  <div id="searchResults" style="margin-top:20px"></div>
  <button id="backBoardFromSearch" class="link">Torna alla Bacheca</button>
</section>

<!-- POPUP PROFILO -->
<div id="profilePopup" class="card hidden" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:999;width:300px">
  <div style="text-align:center">
    <img id="popupPic" src="" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid #e2e8f0;">
    <h3 id="popupName"></h3>
    <p id="popupClasse"></p>
    <p id="popupIndirizzo"></p>
    <button id="closePopup" class="link">Chiudi</button>
  </div>
</div>

<script>
const API_URL='';

// DOM
const pageLogin=document.getElementById('page-login');
const pageBoard=document.getElementById('page-board');
const pageProfile=document.getElementById('page-profile');
const pageSearch=document.getElementById('page-search');
const loginForm=document.getElementById('loginForm');
const emailInput=document.getElementById('email');
const passwordInput=document.getElementById('password');
const loginMsg=document.getElementById('loginMsg');
const resetDiv=document.getElementById('resetDiv');
const resetPasswordBtn=document.getElementById('resetPasswordBtn');
const postBtn=document.getElementById('postBtn');
const bodyInput=document.getElementById('body');
const postsEl=document.getElementById('posts');
const logoutBtn=document.getElementById('logoutBtn');
const gotoProfile=document.getElementById('gotoProfile');
const gotoSearch=document.getElementById('gotoSearch');

const p_pic=document.getElementById('p_pic');
const profilePicPreview=document.getElementById('profilePicPreview');
const p_username=document.getElementById('p_username');
const p_classe=document.getElementById('p_classe');
const p_sezione=document.getElementById('p_sezione');
const p_indirizzo=document.getElementById('p_indirizzo');
const profileForm=document.getElementById('profileForm');
const profileMsg=document.getElementById('profileMsg');
const backBoard=document.getElementById('backBoard');
const deleteProfile=document.getElementById('deleteProfile');

const searchInput=document.getElementById('searchInput');
const searchBtn=document.getElementById('searchBtn');
const searchResults=document.getElementById('searchResults');
const backBoardFromSearch=document.getElementById('backBoardFromSearch');

const profilePopup=document.getElementById('profilePopup');
const popupPic=document.getElementById('popupPic');
const popupName=document.getElementById('popupName');
const popupClasse=document.getElementById('popupClasse');
const popupIndirizzo=document.getElementById('popupIndirizzo');
const closePopup=document.getElementById('closePopup');

let currentUser=null;

function showPage(page){ pageLogin.classList.add('hidden'); pageBoard.classList.add('hidden'); pageProfile.classList.add('hidden'); pageSearch.classList.add('hidden'); page.classList.remove('hidden'); }

// LOGIN
loginForm.addEventListener('submit', e=>{
  e.preventDefault();
  const email=emailInput.value.trim();
  const password=passwordInput.value.trim();
  fetch(`${API_URL}/login`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  }).then(res=>res.json()).then(data=>{
    if(data.success){
      currentUser=data.user;
      localStorage.setItem('student_user',JSON.stringify(currentUser));
      p_username.value=currentUser.username;
      p_classe.value=currentUser.classe||'';
      p_sezione.value=currentUser.sezione||'';
      p_indirizzo.value=currentUser.indirizzo||'';
      profilePicPreview.src=currentUser.profile_pic||'';
      showPage(pageBoard);
      renderPosts();
      if(data.first_login){
        const newPassword=prompt("Primo accesso! Inserisci nuova password:");
        if(newPassword){
          fetch(`${API_URL}/updatePassword`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({user_id:currentUser.id,new_password:newPassword})
          }).then(()=>alert("Password aggiornata."));
        }
      }
    }else{
      loginMsg.textContent=data.message;
      if(data.failed_attempts>=3){
        resetDiv.classList.remove('hidden');
      }
    }
  });
});

// RESET PASSWORD
resetPasswordBtn.addEventListener('click',()=>{
  if(confirm("Vuoi resettare la password?")){
    fetch(`${API_URL}/resetPassword`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:emailInput.value.trim()})
    }).then(()=>alert("Password resettata."));
  }
});

// BACHECA
postBtn.addEventListener('click',()=>{
  const body=bodyInput.value.trim();
  const anon=document.getElementById('anonymous').checked;
  if(!body) return alert('Scrivi un messaggio');
  fetch(`${API_URL}/post`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id:currentUser.id,body,anonymous:anon})
  }).then(()=>{ bodyInput.value=''; renderPosts(); });
});

logoutBtn.addEventListener('click',()=>{ localStorage.removeItem('student_user'); currentUser=null; showPage(pageLogin); });
gotoProfile.addEventListener('click',()=>{ showPage(pageProfile); });
gotoSearch.addEventListener('click',()=>{ showPage(pageSearch); });

// PROFILO
profileForm.addEventListener('submit',e=>{
  e.preventDefault();
  const formData={username:p_username.value,classe:p_classe.value,sezione:p_sezione.value,indirizzo:p_indirizzo.value};
  fetch(`${API_URL}/updateProfile?id=${currentUser.id}`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(formData)
  }).then(res=>res.json()).then(data=>{
    if(data.success){
      profileMsg.textContent='Profilo aggiornato';
      profilePicPreview.src=data.user.profile_pic||'';
      currentUser=data.user;
      localStorage.setItem('student_user',JSON.stringify(currentUser));
      renderPosts();
    }
  });
});

p_pic.addEventListener('change',()=>{
  const file=p_pic.files[0];
  const reader=new FileReader();
  reader.onload=()=>{ profilePicPreview.src=reader.result;
    fetch(`${API_URL}/updateProfile?id=${currentUser.id}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({profile_pic:reader.result})
    });
  }
  reader.readAsDataURL(file);
});

backBoard.addEventListener('click',()=>{ showPage(pageBoard); });

deleteProfile.addEventListener('click',()=>{
  if(confirm("Vuoi eliminare definitivamente il tuo profilo?")){
    fetch(`${API_URL}/deleteProfile`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user_id:currentUser.id})
    }).then(()=>{ localStorage.removeItem('student_user'); currentUser=null; showPage(pageLogin); });
  }
});

// RICERCA PROFILI
searchBtn.addEventListener('click',()=>{
  const q=searchInput.value.trim().toLowerCase();
  searchResults.innerHTML='';
  fetch(`${API_URL}/users`).then(res=>res.json()).then(users=>{
    users.filter(u=>u.username.toLowerCase().includes(q)).forEach(u=>{
      const div=document.createElement('div');
      div.className='card';
      fetch(`${API_URL}/posts`).then(res=>res.json()).then(posts=>{
        const userPosts=posts.filter(p=>p.user_id===u.id && p.anonymous===0);
        div.innerHTML=`<img src='${u.profile_pic||''}' style='width:40px;height:40px;border-radius:50%;margin-right:10px;vertical-align:middle;cursor:pointer;' class="popupTrigger" data-id="${u.id}"/> <strong class="popupTrigger" data-id="${u.id}" style="cursor:pointer;">${u.username}</strong> - Classe ${u.classe}${u.sezione} - ${u.indirizzo}<br><hr>${userPosts.map(p=>p.body).join('<br>')||'Nessun messaggio'}`;
        searchResults.appendChild(div);
      });
    });
  });
});

backBoardFromSearch.addEventListener('click',()=>{ showPage(pageBoard); });

// POPUP PROFILO
document.addEventListener('click', e=>{
  if(e.target.classList.contains('popupTrigger')){
    const id=e.target.dataset.id;
    fetch(`${API_URL}/users`).then(res=>res.json()).then(users=>{
      const u=users.find(u=>u.id==id);
      if(u){
        popupPic.src=u.profile_pic||'';
        popupName.textContent=u.username;
        popupClasse.textContent=`Classe: ${u.classe}${u.sezione}`;
        popupIndirizzo.textContent=`Indirizzo: ${u.indirizzo}`;
        profilePopup.classList.remove('hidden');
      }
    });
  }
});
closePopup.addEventListener('click',()=>{ profilePopup.classList.add('hidden'); });

// RENDER POSTS
function renderPosts(){
  fetch(`${API_URL}/posts`).then(res=>res.json()).then(posts=>{
    postsEl.innerHTML='';
    posts.forEach(p=>{
      const username = p.anonymous ? 'Anonimo' : p.username;
      const profileImg = p.anonymous ? '' : p.profile_pic||'';
      const postDiv=document.createElement('div');
      postDiv.className='post';
      let bodyHTML = p.body.replace(/@([a-zA-Z0-9_.]+)/g, `<a href="#" class="username tag" data-username="$1">@$1</a>`);
      postDiv.innerHTML=`${profileImg?`<img src="${profileImg}"/>`:''}<div class='post-content'><strong>${username}</strong><div>${bodyHTML}</div><div class='meta'>${new Date(p.timestamp).toLocaleString()}</div><div><span class="link" style="color:gray;text-decoration:underline;" onclick="deletePost(${p.id})">Elimina</span></div></div>`;
      postsEl.appendChild(postDiv);
    });
  });
}

function deletePost(id){
  if(confirm("Eliminare questo messaggio?")){
    fetch(`${API_URL}/deletePost`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({post_id:id})
    }).then(()=>renderPosts());
  }
}

// AUTO LOGIN
const storedUser=localStorage.getItem('student_user');
if(storedUser){ currentUser=JSON.parse(storedUser); showPage(pageBoard); renderPosts(); }
</script>
</body>
</html>
