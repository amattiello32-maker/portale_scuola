<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portale Studenti — Accesso, Bacheca, Profilo e Ricerca</title>
<style>
:root{--bg:#f6f8ff;--card:#fff;--accent:#2563eb;--muted:#475569;}
*{box-sizing:border-box;}
body{font-family:Arial,sans-serif;margin:0;background:var(--bg);min-height:100vh;padding:24px;}
.card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,0.06);margin-bottom:20px;}
label{display:block;font-size:13px;color:var(--muted);margin-top:10px;}
input,textarea,select,button{width:100%;padding:10px;margin-top:5px;border-radius:8px;border:1px solid #e6edf9;font-size:14px;}
textarea{resize:vertical;}
button{background:var(--accent);color:#fff;border:none;cursor:pointer;}
.link{background:transparent;border:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:14px;}
.hidden{display:none;}
.post{display:flex;gap:10px;border-bottom:1px solid #eef2ff;padding:10px 0;align-items:flex-start;}
.post img{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;}
.post-content{flex:1;}
.meta{font-size:12px;color:#6b7280;margin-top:4px;}
.popup{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;z-index:1000;}
.popup .card{max-width:400px;width:90%;max-height:90%;overflow-y:auto;position:relative;}
.popup-close{position:absolute;top:10px;right:10px;cursor:pointer;font-weight:bold;}
.delete-link{color:gray;text-decoration:underline;cursor:pointer;font-size:13px;margin-left:10px;}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="page-login" class="card">
<h2>Accesso Studenti</h2>
<p class="muted">Usa il tuo account istituzionale (dominio: <strong>@isisleonardodavincipoggiomarino.it</strong>). La password iniziale è <strong>SG20513</strong>.</p>
<form id="loginForm">
<label>Email</label>
<input type="email" id="email" placeholder="nome.cognome@isisleonardodavincipoggiomarino.it" required>
<label>Password</label>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Accedi</button>
<div id="loginMsg" class="muted"></div>
</form>
<div id="changePassDiv" class="hidden card">
<h3>Cambia Password</h3>
<label>Nuova password</label>
<input type="password" id="newPass">
<button id="saveNewPass">Salva</button>
<div id="changePassMsg" class="muted"></div>
</div>
</section>

<!-- BACHECA -->
<section id="page-board" class="hidden">
<section id="posts" class="card"></section>
<div class="card">
<h2>Bacheca</h2>
<label>Scrivi il tuo messaggio</label>
<textarea id="body" rows="4"></textarea>
<label><input type="checkbox" id="anonymous"> Pubblica in anonimo</label>
<div style="display:flex;gap:8px;margin-top:10px;">
<button id="postBtn">Pubblica</button>
<button id="gotoProfile" class="link">Profilo</button>
<button id="gotoSearch" class="link">Cerca Profili</button>
<button id="logoutBtn" class="link">Esci</button>
</div>
</div>
</section>

<!-- PROFILO -->
<section id="page-profile" class="card hidden">
<h2>Profilo</h2>
<form id="profileForm">
<div style="text-align:center;">
<img id="profilePicPreview" src="" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:2px solid #e2e8f0;cursor:pointer;">
</div>
<label>Carica foto profilo</label>
<input type="file" id="p_pic" accept="image/*">
<label>Username</label>
<input type="text" id="p_username">
<label>Classe</label>
<select id="p_classe"><option value="">-- seleziona --</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<label>Sezione</label>
<select id="p_sezione"><option value="">-- seleziona --</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
<label>Indirizzo</label>
<select id="p_indirizzo"><option value="">-- seleziona --</option><option>OSA</option><option>AFM</option><option>SIA</option><option>Q</option><option>CAT</option><option>ITI</option><option>LC</option><option>LL</option><option>LS</option></select>
<button type="submit">Salva Profilo</button>
<button type="button" id="deleteProfile" class="link">Elimina Profilo</button>
<button type="button" id="backBoard" class="link">Torna alla Bacheca</button>
<div id="profileMsg" class="muted"></div>
</form>
</section>

<!-- CERCA -->
<section id="page-search" class="card hidden">
<h2>Cerca Profili</h2>
<input type="text" id="searchInput" placeholder="Username">
<button id="searchBtn">Cerca</button>
<div id="searchResults" style="margin-top:20px;"></div>
<button id="backBoardFromSearch" class="link">Torna alla Bacheca</button>
</section>

<!-- POPUP PROFILO -->
<div id="popupProfile" class="popup hidden">
<div class="card">
<span class="popup-close" id="popupClose">×</span>
<div id="popupContent"></div>
</div>
</div>

<script>
const API_URL='';
const pageLogin=document.getElementById('page-login');
const pageBoard=document.getElementById('page-board');
const pageProfile=document.getElementById('page-profile');
const pageSearch=document.getElementById('page-search');
const loginForm=document.getElementById('loginForm');
const emailInput=document.getElementById('email');
const passwordInput=document.getElementById('password');
const loginMsg=document.getElementById('loginMsg');
const changePassDiv=document.getElementById('changePassDiv');
const newPassInput=document.getElementById('newPass');
const saveNewPass=document.getElementById('saveNewPass');
const changePassMsg=document.getElementById('changePassMsg');

const postBtn=document.getElementById('postBtn');
const bodyInput=document.getElementById('body');
const postsEl=document.getElementById('posts');
const logoutBtn=document.getElementById('logoutBtn');
const gotoProfile=document.getElementById('gotoProfile');
const gotoSearch=document.getElementById('gotoSearch');

const p_pic=document.getElementById('p_pic');
const profilePicPreview=document.getElementById('profilePicPreview');
const p_username=document.getElementById('p_username');
const p_classe=document.getElementById('p_classe');
const p_sezione=document.getElementById('p_sezione');
const p_indirizzo=document.getElementById('p_indirizzo');
const profileForm=document.getElementById('profileForm');
const profileMsg=document.getElementById('profileMsg');
const backBoard=document.getElementById('backBoard');
const deleteProfile=document.getElementById('deleteProfile');

const searchInput=document.getElementById('searchInput');
const searchBtn=document.getElementById('searchBtn');
const searchResults=document.getElementById('searchResults');
const backBoardFromSearch=document.getElementById('backBoardFromSearch');

const popupProfile=document.getElementById('popupProfile');
const popupContent=document.getElementById('popupContent');
const popupClose=document.getElementById('popupClose');

function showPage(page){
  [pageLogin,pageBoard,pageProfile,pageSearch,changePassDiv].forEach(p=>p.classList.add('hidden'));
  page.classList.remove('hidden');
}

// LOGIN
loginForm.addEventListener('submit',e=>{
  e.preventDefault();
  const email=emailInput.value.trim();
  const password=passwordInput.value.trim();
  fetch(`${API_URL}/login`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  }).then(r=>r.json()).then(data=>{
    if(data.success){
      localStorage.setItem('student_user',JSON.stringify(data.user));
      if(data.changePassword){
        showPage(changePassDiv);
      }else{
        loadProfileData(data.user);
        renderPosts();
        showPage(pageBoard);
      }
    }else loginMsg.textContent=data.message;
  });
});

// Cambio password
saveNewPass.addEventListener('click',()=>{
  const user=JSON.parse(localStorage.getItem('student_user'));
  fetch(`${API_URL}/changePassword`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:user.id,newPassword:newPassInput.value})
  }).then(r=>r.json()).then(data=>{
    if(data.success){
      localStorage.setItem('student_user',JSON.stringify(data.user));
      loadProfileData(data.user);
      showPage(pageBoard);
    }
  });
});

function loadProfileData(user){
  p_username.value=user.username||'';
  p_classe.value=user.classe||'';
  p_sezione.value=user.sezione||'';
  p_indirizzo.value=user.indirizzo||'';
  profilePicPreview.src=user.profile_pic||'';
}

// BACHECA
postBtn.addEventListener('click',()=>{
  const user=JSON.parse(localStorage.getItem('student_user'));
  const body=bodyInput.value.trim();
  const anon=document.getElementById('anonymous').checked;
  if(!body) return alert('Scrivi un messaggio');
  fetch(`${API_URL}/post`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id:user.id,body,anonymous:anon})
  }).then(()=>{ bodyInput.value=''; renderPosts(); });
});

logoutBtn.addEventListener('click',()=>{ localStorage.removeItem('student_user'); showPage(pageLogin); });
gotoProfile.addEventListener('click',()=>{ showPage(pageProfile); });
gotoSearch.addEventListener('click',()=>{ showPage(pageSearch); });

// PROFILO
profileForm.addEventListener('submit',e=>{
  e.preventDefault();
  const user=JSON.parse(localStorage.getItem('student_user'));
  const fd=new FormData();
  fd.append('username',p_username.value);
  fd.append('classe',p_classe.value);
  fd.append('sezione',p_sezione.value);
  fd.append('indirizzo',p_indirizzo.value);
  if(p_pic.files[0]) fd.append('profile_pic',p_pic.files[0]);
  fetch(`${API_URL}/updateProfile?id=${user.id}`,{
    method:'POST',
    body:fd
  }).then(()=>{ profileMsg.textContent='Profilo aggiornato'; renderPosts(); });
});

p_pic.addEventListener('change',()=>{
  const reader=new FileReader();
  reader.onload=()=>{ profilePicPreview.src=reader.result; }
  reader.readAsDataURL(p_pic.files[0]);
});

backBoard.addEventListener('click',()=>{ showPage(pageBoard); });

// ELIMINA PROFILO
deleteProfile.addEventListener('click',()=>{
  const user=JSON.parse(localStorage.getItem('student_user'));
  if(confirm('Vuoi eliminare definitivamente il tuo profilo?')){
    fetch(`${API_URL}/deleteProfile?id=${user.id}`,{method:'POST'})
      .then(()=>{ localStorage.removeItem('student_user'); showPage(pageLogin); });
  }
});

// RICERCA PROFILI
searchBtn.addEventListener('click',()=>{
  const q=searchInput.value.trim().toLowerCase();
  searchResults.innerHTML='';
  fetch(`${API_URL}/users`).then(r=>r.json()).then(users=>{
    users.filter(u=>u.username.toLowerCase().includes(q)).forEach(u=>{
      const div=document.createElement('div');
      div.className='card';
      div.innerHTML=`<img src='${u.profile_pic||''}'/><strong style="cursor:pointer">${u.username}</strong> - Classe ${u.classe}${u.sezione} - ${u.indirizzo}`;
      div.querySelector('strong').addEventListener('click',()=>showUserPopup(u));
      div.querySelector('img').addEventListener('click',()=>showUserPopup(u));
      searchResults.appendChild(div);
    });
  });
});

backBoardFromSearch.addEventListener('click',()=>{ showPage(pageBoard); });

// POPUP PROFILO
function showUserPopup(user){
  popupContent.innerHTML=`<div style="text-align:center">
    <img src="${user.profile_pic||''}" style="width:100px;height:100px;border-radius:50%;object-fit:cover;"><br>
    <strong>${user.username}</strong><br>
    Classe: ${user.classe}${user.sezione}<br>
    Indirizzo: ${user.indirizzo}<br>
    <hr><div id="popupPosts">Caricamento messaggi...</div>
  </div>`;
  popupProfile.classList.remove('hidden');
  fetch(`${API_URL}/posts`).then(r=>r.json()).then(posts=>{
    const userPosts=posts.filter(p=>p.user_id===user.id);
    const el=document.getElementById('popupPosts');
    el.innerHTML=userPosts.map(p=>p.body).join('<br>')||'Nessun messaggio';
  });
}
popupClose.addEventListener('click',()=> popupProfile.classList.add('hidden'));

// RENDER POSTS
function renderPosts(){
  fetch(`${API_URL}/posts`).then(r=>r.json()).then(posts=>{
    postsEl.innerHTML='';
    posts.forEach(p=>{
      const div=document.createElement('div');
      div.className='post';
      const bodyWithTags=p.body.replace(/@(\w+)/g,`<span style="color:blue;cursor:pointer">@$1</span>`);
      div.innerHTML=`<img src="${p.profile_pic||''}"/><div class="post-content"><strong>${p.anonymous?'Anonimo':p.username}</strong> <span>${bodyWithTags}</span>
      <div class="meta">${new Date(p.timestamp).toLocaleString()} 
      ${!p.anonymous?'<span class="delete-link" onclick="deletePost('+p.id+')">Elimina</span>':''}</div></div>`;
      postsEl.appendChild(div);
    });
  });
}

// DELETE POST
function deletePost(id){
  if(confirm('Eliminare questo messaggio?')){
    fetch(`${API_URL}/deletePost?id=${id}`,{method:'POST'}).then(()=>renderPosts());
  }
}

// AUTOLOAD SE LOGGATO
const currentUser=localStorage.getItem('student_user');
if(currentUser){
  const u=JSON.parse(currentUser);
  loadProfileData(u);
  renderPosts();
  showPage(pageBoard);
}
</script>
</body>
</html>

</html>
