<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portale Studenti — Accesso, Bacheca, Profilo e Ricerca</title>
<style>
:root{--bg:#f6f8ff;--card:#ffffff;--accent:#2563eb;--muted:#475569}
*{box-sizing:border-box}
body{font-size:18px;font-family:Inter,system-ui,Arial;margin:0;background:linear-gradient(180deg,var(--bg),#eef2ff);min-height:100vh;padding:24px}
.card{background:var(--card);padding:18px;border-radius:12px;box-shadow:0 8px 30px rgba(15,23,42,0.06);margin-bottom:20px}
label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
input[type="text"],input[type="email"],input[type="password"],textarea,select{width:100%;padding:10px;border:1px solid #e6edf9;border-radius:8px;font-size:14px}
textarea{resize:vertical}
button{padding:8px 12px;border-radius:8px;border:0;cursor:pointer;background:var(--accent);color:#fff;margin-top:10px}
.link{background:transparent;border:0;color:#475569;text-decoration:underline;cursor:pointer;margin-left:5px;}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none}
.post{border-bottom:1px solid #eef2ff;padding:12px 0; display:flex; align-items:flex-start; gap:10px;}
.post img{width:40px;height:40px;border-radius:50%;object-fit:cover;}
.post-content{flex:1;}
.meta{font-size:12px;color:#6b7280; margin-top:4px;}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="page-login" class="card">
  <h2>Accesso Studenti</h2>
  <p class="muted">Usa il tuo account istituzionale (dominio: <strong>@isisleonardodavincipoggiomarino.it</strong>). La password predefinita è <strong>SG20513</strong>.</p>
  <form id="loginForm" autocomplete="off">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="nome.cognome@isisleonardodavincipoggiomarino.it" required />
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="La password condivisa" required />
    <button type="submit">Accedi</button>
    <div id="loginMsg" class="muted"></div>
  </form>
</section>

<!-- CAMBIO PASSWORD -->
<section id="page-change-password" class="card hidden">
  <h2>Cambia Password</h2>
  <form id="changePasswordForm">
    <label for="newPassword">Nuova Password</label>
    <input id="newPassword" type="password" placeholder="Inserisci nuova password" required/>
    <button type="submit">Salva</button>
  </form>
  <div id="changePasswordMsg" class="muted"></div>
</section>

<!-- BACHECA -->
<section id="page-board" class="hidden">
  <section id="posts" class="card"></section>
  <div class="card">
    <h2>Bacheca della scuola</h2>
    <p class="muted">Scrivi liberamente: puoi postare con il tuo account o in anonimo.</p>
    <label for="body">Contenuto</label>
    <textarea id="body" rows="5" placeholder="Scrivi qui..."></textarea>
    <label><input type="checkbox" id="anonymous"> Pubblica in anonimo</label>
    <div class="actions">
      <button id="postBtn">Pubblica</button>
      <button id="gotoProfile" class="link">Profilo</button>
      <button id="gotoSearch" class="link">Cerca Profili</button>
      <button id="logoutBtn" class="link">Esci</button>
    </div>
  </div>
</section>

<!-- PROFILO -->
<section id="page-profile" class="card hidden">
  <h2>Profilo Studente</h2>
  <form id="profileForm">
    <div style="text-align:center;margin-bottom:14px">
      <img id="profilePicPreview" src="" style="width:110px;height:110px;border-radius:50%;object-fit:cover;border:2px solid #e2e8f0;" />
    </div>
    <label for="p_pic">Foto profilo</label>
    <input id="p_pic" type="file" accept="image/*" />
    <label for="p_username">Username</label>
    <input id="p_username" type="text" placeholder="Nome visualizzato" />
    <label for="p_classe">Classe</label>
    <select id="p_classe"><option value="">-- seleziona --</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <label for="p_sezione">Sezione</label>
    <select id="p_sezione"><option value="">-- seleziona --</option><option>A</option><option>B</option><option>C</option><option>D</option></select>
    <label for="p_indirizzo">Indirizzo</label>
    <select id="p_indirizzo"><option value="">-- seleziona --</option><option>OSA</option><option>AFM</option><option>SIA</option><option>Q</option><option>CAT</option><option>ITI</option><option>LC</option><option>LL</option><option>LS</option></select>
    <button type="submit">Salva Profilo</button>
    <button type="button" id="backBoard" class="link">Torna alla Bacheca</button>
    <div id="profileMsg" class="muted" style="margin-top:10px"></div>
  </form>
</section>

<!-- CERCA PROFILI -->
<section id="page-search" class="card hidden">
  <h2>Cerca Profili</h2>
  <label for="searchInput">Username</label>
  <input id="searchInput" type="text" placeholder="Inserisci username..." />
  <button id="searchBtn">Cerca</button>
  <div id="searchResults" style="margin-top:20px"></div>
  <button id="backBoardFromSearch" class="link">Torna alla Bacheca</button>
</section>

<script>
const API_URL='';
const DOMAIN="@isisleonardodavincipoggiomarino.it";
const DEFAULT_PASS="SG20513";

const pageLogin=document.getElementById('page-login');
const pageBoard=document.getElementById('page-board');
const pageProfile=document.getElementById('page-profile');
const pageSearch=document.getElementById('page-search');
const pageChangePassword=document.getElementById('page-change-password');

function showPage(page){
  [pageLogin,pageBoard,pageProfile,pageSearch,pageChangePassword].forEach(p=>p.classList.add('hidden'));
  page.classList.remove('hidden');
}

// LOGIN
document.getElementById('loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value.trim();
  if(!email.endsWith(DOMAIN)){
    document.getElementById('loginMsg').textContent="Usa un account con dominio "+DOMAIN;
    return;
  }
  fetch(`${API_URL}/login`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email,password})
  }).then(res=>res.json()).then(data=>{
    if(data.success){
      localStorage.setItem('student_user',JSON.stringify(data.user));
      if(data.mustChangePassword){ showPage(pageChangePassword); return; }
      loadProfile(data.user);
      renderPosts();
      showPage(pageBoard);
    }else document.getElementById('loginMsg').textContent=data.message;
  });
});

// CAMBIO PASSWORD
document.getElementById('changePasswordForm').addEventListener('submit',e=>{
  e.preventDefault();
  const newPass=document.getElementById('newPassword').value.trim();
  const user=JSON.parse(localStorage.getItem('student_user'));
  if(!newPass) return;
  fetch(`${API_URL}/changePassword?id=${user.id}`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:newPass})
  }).then(()=>{ user.password=newPass; localStorage.setItem('student_user',JSON.stringify(user)); loadProfile(user); renderPosts(); showPage(pageBoard); });
});

// Funzioni di profilo e bacheca
const p_pic=document.getElementById('p_pic');
const profilePicPreview=document.getElementById('profilePicPreview');
const p_username=document.getElementById('p_username');
const p_classe=document.getElementById('p_classe');
const p_sezione=document.getElementById('p_sezione');
const p_indirizzo=document.getElementById('p_indirizzo');
const profileForm=document.getElementById('profileForm');
const profileMsg=document.getElementById('profileMsg');
const backBoard=document.getElementById('backBoard');

document.getElementById('postBtn').addEventListener('click',()=>{
  const user=JSON.parse(localStorage.getItem('student_user'));
  const body=document.getElementById('body').value.trim();
  const anonymous=document.getElementById('anonymous').checked;
  if(!body) return alert("Scrivi un messaggio");
  fetch(`${API_URL}/post`,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user_id: user.id, body, anonymous})
  }).then(()=>{ document.getElementById('body').value=''; renderPosts(); });
});

document.getElementById('logoutBtn').addEventListener('click',()=>{ localStorage.removeItem('student_user'); showPage(pageLogin); });
document.getElementById('gotoProfile').addEventListener('click',()=>{ showPage(pageProfile); });
document.getElementById('gotoSearch').addEventListener('click',()=>{ showPage(pageSearch); });

// SALVA PROFILO
profileForm.addEventListener('submit',e=>{
  e.preventDefault();
  const user=JSON.parse(localStorage.getItem('student_user'));
  const formData=new FormData();
  formData.append('username',p_username.value);
  formData.append('classe',p_classe.value);
  formData.append('sezione',p_sezione.value);
  formData.append('indirizzo',p_indirizzo.value);
  fetch(`${API_URL}/updateProfile?id=${user.id}`,{method:'POST',body:formData}).then(()=>{ profileMsg.textContent='Profilo aggiornato'; loadProfile(user); renderPosts(); });
});

// CARICA FOTO PROFILO
p_pic.addEventListener('change',()=>{
  const file=p_pic.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{ profilePicPreview.src=reader.result;
    const user=JSON.parse(localStorage.getItem('student_user'));
    fetch(`${API_URL}/updateProfile?id=${user.id}`,{
      method:'POST', body:JSON.stringify({profile_pic:reader.result}), headers:{'Content-Type':'application/json'}
    });
  };
  reader.readAsDataURL(file);
});

backBoard.addEventListener('click',()=>{ showPage(pageBoard); });

// RICERCA PROFILI
document.getElementById('searchBtn').addEventListener('click',()=>{
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const results=document.getElementById('searchResults'); results.innerHTML='';
  fetch(`${API_URL}/users`).then(res=>res.json()).then(users=>{
    users.filter(u=>u.username.toLowerCase().includes(q)).forEach(u=>{
      const div=document.createElement('div'); div.className='card';
      fetch(`${API_URL}/posts`).then(res=>res.json()).then(posts=>{
        const userPosts=posts.filter(p=>p.user_id===u.id && !p.anonymous);
        div.innerHTML=`<img src='${u.profile_pic||''}' style='width:40px;height:40px;border-radius:50%;margin-right:10px;'> <strong>${u.username}</strong> - Classe ${u.classe}${u.sezione} - ${u.indirizzo}<br><hr>${userPosts.map(p=>p.body.replace(/@(\w+)/g, '<a href="#" onclick="searchTag(\'$1\')">@$1</a>')).join('<br>')||'Nessun messaggio'}`;
        results.appendChild(div);
      });
    });
  });
});

document.getElementById('backBoardFromSearch').addEventListener('click',()=>{ showPage(pageBoard); });

function searchTag(username){
  document.getElementById('searchInput').value=username; document.getElementById('searchBtn').click();
}

// RENDER POST
function renderPosts(){
  const postsEl=document.getElementById('posts');
  const user=JSON.parse(localStorage.getItem('student_user')||'{}');
  postsEl.innerHTML='';
  fetch(`${API_URL}/posts`).then(res=>res.json()).then(posts=>{
    posts.forEach(p=>{
      let name=p.anonymous?"Anonimo":p.username;
      let img=p.anonymous?"":p.profile_pic||"";
      const div=document.createElement('div');
      div.className='post';
      div.innerHTML=`${img?`<img src='${img}'>`:''}<div class='post-content'><strong>${name}</strong><div>${p.body.replace(/@(\w+)/g, '<a href="#" onclick="searchTag(\'$1\')">@$1</a>')}</div><div class='meta'>${new Date(p.timestamp).toLocaleString()} <span class="link" onclick="deletePost(${p.id})">Elimina</span></div></div>`;
      postsEl.appendChild(div);
    });
  });
}

// ELIMINA POST
function deletePost(id){
  fetch(`${API_URL}/deletePost?id=${id}`,{method:'POST'}).then(()=>renderPosts());
}

// CARICA PROFILO
function loadProfile(user){
  p_username.value=user.username||user.email.split('@')[0];
  p_classe.value=user.classe||'';
  p_sezione.value=user.sezione||'';
  p_indirizzo.value=user.indirizzo||'';
  profilePicPreview.src=user.profile_pic||'';
}

// LOGIN AUTOMATICO
const currentUser=localStorage.getItem('student_user');
if(currentUser){ const user=JSON.parse(currentUser); loadProfile(user); renderPosts(); showPage(pageBoard); }
</script>
</body>
</html>
